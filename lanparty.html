<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>LAN-Party | Alfa-college</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #eee;
    }
    body {
      min-height: 100vh;
      background: url('img/background_image.webp') no-repeat center center fixed;
      background-size: cover;
      position: relative;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      background: rgba(238,238,238,0.2);
    }
    .form-box {
      background: rgba(255,255,255,0.7);
      width: 370px;
      margin: 40px 0 40px 40px;
      padding: 25px 30px 30px 30px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
    }
    .form-box h2 {
      text-align: left;
      margin-bottom: 24px;
      font-size: 26px;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
      font-size: 15px;
    }
    input, select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
      margin-bottom: 6px;
      background: #fff;
      box-sizing: border-box;
    }
    button {
      margin-top: 18px;
      width: 100%;
      padding: 12px 0;
      border: none;
      border-radius: 7px;
      background: #e74c3c;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #c0392b;
    }
    .divider {
      width: 4px;
      background: #e74c3c;
      margin: 40px 0;
      border-radius: 2px;
      box-shadow: 0 0 6px #e74c3c44;
    }
    .info-box {
      flex: 1;
      background: rgba(255,255,255,0.7);
      margin: 40px 40px 40px 0;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
    }
    .info-box p {
      font-size: 32px;
      font-weight: bold;
      color: #222;
      transform: rotate(-20deg);
      margin: 0;
      letter-spacing: 1px;
      text-shadow: 0 2px 8px #fff8;
    }
    /* Alfa-college logo */
    .alfa-logo {
      position: absolute;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      z-index: 2;
      pointer-events: none;
      user-select: none;
    }
    .alfa-logo .a {
      font-size: 54px;
      font-weight: bold;
      color: #e74c3c;
      font-family: Arial Black, Arial, sans-serif;
      margin-right: 6px;
      letter-spacing: -2px;
    }
    .alfa-logo .alfa {
      font-size: 36px;
      color: #e74c3c;
      font-weight: bold;
      margin-right: 8px;
      letter-spacing: -1px;
    }
    .alfa-logo .college {
      font-size: 32px;
      color: #3b5998;
      font-weight: 400;
      letter-spacing: 0.5px;
      opacity: 0.8;
    }
    @media (max-width: 900px) {
      .overlay { flex-direction: column; }
      .divider { width: 100%; height: 4px; margin: 0 40px; }
      .form-box, .info-box { margin: 40px; }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="form-box">
      <h2>Lan-Party</h2>
      <form>
        <label for="voornaam">Voornaam</label>
        <input type="text" id="voornaam" name="voornaam">

        <label for="achternaam">Achternaam</label>
        <input type="text" id="achternaam" name="achternaam">

        <label for="email">Email</label>
        <input type="email" id="email" name="email">

        <label for="klas">Klas</label>
        <select id="klas" name="klas">
          <option value="">Selecteer Klas</option>
          <option value="1A">1A</option>
          <option value="1B">1B</option>
          <option value="2A">2A</option>
          <option value="2B">2B</option>
        </select>

        <button type="submit">Volgende</button>
      </form>
    </div>
    <div class="divider"></div>
    <div class="info-box">
      <p>Informatie over lanparty</p>
      <div class="alfa-logo">
        <span class="a">A</span>
        <span class="alfa">Alfa</span>
        <span class="college">- college</span>
      </div>
    </div>
  </div>
</body>
</html>
